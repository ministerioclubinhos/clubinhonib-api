name: Deploy Production Clubinho API

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production-clubinho
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: prod-clubinho-nib-api
  ECS_SERVICE: prod-clubinho-nib-api
  ECS_CLUSTER: prod-cluster
  CONTAINER_NAME: clubinho-nib-api
  APP_PORT: 3000

jobs:
  deploy:
    name: Build, Push and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 🔐 Credenciais de DEPLOY (acesso ao ECR e ECS)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ALB_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ALB_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f DockerFile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Remove campos somente-leitura que o register-task-definition não aceita
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition \
            --output json \
          | jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )' > task-definition.json

      # Atualiza a imagem e as variáveis de ambiente da aplicação.
      # NÃO inclui AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY:
      # o container usa a IAM Task Role do ECS para acessar S3 e SES.
      - name: Validate runtime configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
        run: |
          required=(
            DB_HOST
            DB_PORT
            DB_USERNAME
            DB_PASSWORD
            JWT_SECRET
            JWT_EXPIRES_IN
            JWT_REFRESH_SECRET
            JWT_REFRESH_EXPIRES_IN
          )

          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required for production deploy"
              exit 1
            fi
          done

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            ENVIRONMENT=production
            PORT=${{ env.APP_PORT }}
            AWS_REGION=${{ env.AWS_REGION }}
            AWS_S3_BUCKET_NAME=clubinho-nib-storage
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=clubinho-nib-prod
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
            SES_DEFAULT_FROM=${{ secrets.SES_DEFAULT_FROM }}
            SES_DEFAULT_TO=${{ secrets.SES_DEFAULT_TO }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_WHATSAPP_FROM=${{ secrets.TWILIO_WHATSAPP_FROM }}
            TWILIO_WHATSAPP_TO=${{ secrets.TWILIO_WHATSAPP_TO }}
            FEED_CLUBINHO_PAGE_ID=${{ secrets.FEED_CLUBINHO_PAGE_ID }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          force-new-deployment: true

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "   ✅ Deploy ECS Producao Clubinho - OK!"
          echo "============================================"
          echo "  Cluster : ${{ env.ECS_CLUSTER }}"
          echo "  Servico : ${{ env.ECS_SERVICE }}"
          echo "  Imagem  : ${{ steps.build-image.outputs.image }}"
          echo "  SHA     : ${{ github.sha }}"
