name: Deploy Production Clubinho API

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production-clubinho
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: prod-clubinho-nib-api
  STACK_TAG: super-stack-prod

jobs:
  deploy:
    name: Build ARM64 and Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::614946928663:role/super-stack-prod-deploy-clubinho
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ARM64 image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA-arm64"
          docker buildx build --platform linux/arm64 -f DockerFile \
            --tag "$IMAGE" --push .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # O deploy.sh atualiza images.env e recria somente clubinho-api.
      # As variáveis da aplicação permanecem em /mnt/data/env/clubinho.env.
      - name: Deploy to EC2 via SSM
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail
          aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=$STACK_TAG" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output json > instances.json
          INSTANCE_ID=$(jq -er 'if length == 1 then .[0] else error("Expected exactly one running production instance") end' instances.json)

          jq -n --arg command "/opt/super-stack/scripts/deploy.sh clubinho $IMAGE" \
            '{commands: [$command], executionTimeout: ["300"]}' > ssm-parameters.json
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy Clubinho $GITHUB_SHA" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' --output text)

          STATUS=Pending
          for attempt in $(seq 1 72); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
          test "$STATUS" = Success

      - name: Check API health
        run: |
          curl -fsS --connect-timeout 10 --max-time 20 \
            --retry 10 --retry-delay 5 --retry-all-errors \
            https://clubinho-nib-api.rodolfo-silva.com/health
